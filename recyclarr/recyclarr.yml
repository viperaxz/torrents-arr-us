# Recyclarr v8 — TRaSH Guides configuration for win-seedbox
# https://trash-guides.info  |  https://recyclarr.dev/wiki/yaml/config-reference/
#
# Run:     recyclarr.exe sync -c recyclarr.yml
# Preview: recyclarr.exe sync -c recyclarr.yml --preview
#
# Secrets are written to %APPDATA%\recyclarr\secrets.yml by configure_layer2_recyclarr.ps1.
# All trash_ids verified against trash/Guides/docs/json (local TRaSH-Guides clone).

# ── Sonarr ─────────────────────────────────────────────────────────────────────

sonarr:
  sonarr-main:
    base_url: !secret sonarr_base_url
    api_key: !secret sonarr_api_key

    quality_definition:
      type: series

    delete_old_custom_formats: false

    quality_profiles:

      # Primary TV profile: 1080p WEB-DL preferred, 720p fallback.
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
        min_format_score: 0
        min_upgrade_format_score: 1
        quality_sort: top
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p

      # Optional 4K WEB TV profile: 4K WEB-DL first, falls back to 1080p WEB-DL.
      - name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
        min_format_score: 0
        min_upgrade_format_score: 1
        quality_sort: top
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p

      # Optional Remux TV profile: Bluray-2160p Remux > WEB-2160p > Bluray-1080p Remux.
      # Note: Sonarr names remux qualities "Bluray-Xp Remux", not "Remux-Xp".
      - name: Remux-2160p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p Remux
          until_score: 10000
        min_format_score: 0
        min_upgrade_format_score: 1
        quality_sort: top
        qualities:
          - name: Bluray-2160p Remux
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p Remux

    custom_formats:

      # ── Unwanted: blocked in all profiles ─────────────────────────────────
      - trash_ids:
          - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
          - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
          - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
          - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
          - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
        assign_scores_to:
          - name: WEB-1080p
            score: -10000
          - name: WEB-2160p
            score: -10000
          - name: Remux-2160p
            score: -10000

      # ── Misc ──────────────────────────────────────────────────────────────
      - trash_ids:
          - ec8fa7296b64e8cd390a1600981f3923  # Repack/Proper
        assign_scores_to:
          - name: WEB-1080p
            score: 5
          - name: WEB-2160p
            score: 5
          - name: Remux-2160p
            score: 5

      # ── WEB Tier Release Groups ────────────────────────────────────────────
      - trash_ids:
          - e6258996055b9fbab7e9cb2f75819294  # WEB Tier 01
        assign_scores_to:
          - name: WEB-1080p
            score: 1700
          - name: WEB-2160p
            score: 1700
          - name: Remux-2160p
            score: 1700
      - trash_ids:
          - 58790d4e2fdcd9733aa7ae68ba2bb503  # WEB Tier 02
        assign_scores_to:
          - name: WEB-1080p
            score: 1250
          - name: WEB-2160p
            score: 1250
          - name: Remux-2160p
            score: 1250
      - trash_ids:
          - d84935abd3f8556dcd51d4f27e22d0a6  # WEB Tier 03
        assign_scores_to:
          - name: WEB-1080p
            score: 1000
          - name: WEB-2160p
            score: 1000
          - name: Remux-2160p
            score: 1000

      # ── Remux Tier Release Groups (Remux-2160p profile only) ───────────────
      - trash_ids:
          - 9965a052eb87b0d10313b1cea89eb451  # Remux Tier 01
        assign_scores_to:
          - name: Remux-2160p
            score: 1700
      - trash_ids:
          - 8a1d0c3d7497e741736761a1da866a2e  # Remux Tier 02
        assign_scores_to:
          - name: Remux-2160p
            score: 1650

      # ── Streaming Services (prefer known-good sources) ─────────────────────
      - trash_ids:
          - d34870697c9db575f17700212167be23  # NF (Netflix)
          - d660701077794679fd59e8bdf4ce3a29  # AMZN (Amazon)
          - f67c9ca88f463a48346062e8ad07713f  # ATVP (Apple TV+)
          - 89358767a60cc28783cdc3d0be9388a4  # DSNP (Disney+)
          - 7a235133c87f7da4c8cccceca7e3c7a6  # HBO
          - a880d6abc21e7c16884f3ae393f84179  # HMAX (HBO Max)
          - f6cce30f1733d5c8194222a7507909bb  # HULU
          - 81d1fbf600e2540cee87f3a23f9d3c1c  # MAX
        assign_scores_to:
          - name: WEB-1080p
            score: 15
          - name: WEB-2160p
            score: 15
          - name: Remux-2160p
            score: 15

      # ── HDR Boosts (4K profiles — prefer better HDR tiers) ────────────────
      - trash_ids:
          - 7c3a61a9c6cb04f52f1544be6d44a026  # DV Boost
        assign_scores_to:
          - name: WEB-2160p
            score: 15
          - name: Remux-2160p
            score: 15
      - trash_ids:
          - 0c4b99df9206d2cfac3c05ab897dd62a  # HDR10+ Boost
        assign_scores_to:
          - name: WEB-2160p
            score: 10
          - name: Remux-2160p
            score: 10
      - trash_ids:
          - 505d871304820ba7106b693be6fe4a9e  # HDR
        assign_scores_to:
          - name: WEB-2160p
            score: 5
          - name: Remux-2160p
            score: 5

      # ── Audio: DD+ / Atmos (available on streaming, 4K profiles) ──────────
      - trash_ids:
          - 4232a509ce60c4e208d13825b7c06264  # DD+ ATMOS
        assign_scores_to:
          - name: WEB-2160p
            score: 3000
          - name: Remux-2160p
            score: 3000
      - trash_ids:
          - 63487786a8b01b7f20dd2bc90dd4a477  # DD+
        assign_scores_to:
          - name: WEB-2160p
            score: 1750
          - name: Remux-2160p
            score: 1750

      # ── Audio: Lossless (Remux-2160p only) ────────────────────────────────
      - trash_ids:
          - 0d7824bb924701997f874e7ff7d4844a  # TrueHD ATMOS
        assign_scores_to:
          - name: Remux-2160p
            score: 5000
      - trash_ids:
          - 9d00418ba386a083fbf4d58235fc37ef  # DTS X
        assign_scores_to:
          - name: Remux-2160p
            score: 4500
      - trash_ids:
          - 1808e4b9cee74e064dfae3f1db99dbfe  # TrueHD
        assign_scores_to:
          - name: Remux-2160p
            score: 2750
      - trash_ids:
          - c429417a57ea8c41d57e6990a8b0033f  # DTS-HD MA
        assign_scores_to:
          - name: Remux-2160p
            score: 2500

